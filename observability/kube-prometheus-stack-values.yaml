# Values do chart prometheus-community/kube-prometheus-stack.
# Referenciado pela Application "kube-prometheus-stack" em argocd/apps/.

prometheus:
  prometheusSpec:
    retention: 15d
    # Seleciona QUALQUER ServiceMonitor/PodMonitor do cluster, não só os com o label
    # padrão do release do Helm - evita fricção de label-matching no hackathon.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { cpu: 500m, memory: 1Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 150m, memory: 128Mi }
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "service"]
      group_wait: 15s
      group_interval: 1m
      repeat_interval: 2h
      receiver: "default-null"
      routes:
        # Alertas mapeados no healer-service (apps/healer-service/app.py) disparam
        # auto-healing via webhook - parte central da narrativa de MTTR do relatório de SRE.
        - receiver: "healer-service"
          matchers:
            - alertname =~ "DonationServiceHighErrorRate|DonationServiceHighLatency|DonationServiceCrashLooping|NgoServiceCrashLooping|VolunteerServiceCrashLooping"
          continue: true
        # Comunicação a stakeholders (item do fluxo ITSM, docs/ITSM-AIOPS.md): troque a URL
        # abaixo por um Slack/Teams/Email webhook real antes da gravação do vídeo.
        - receiver: "stakeholders"
          matchers:
            - severity = "critical"
    receivers:
      - name: "default-null"
      - name: "healer-service"
        webhook_configs:
          - url: "http://healer-service.solidarytech.svc.cluster.local:8090/webhook/alertmanager"
            send_resolved: false
      - name: "stakeholders"
        webhook_configs:
          - url: "https://SUBSTITUIR-POR-WEBHOOK-SLACK-OU-TEAMS"
            send_resolved: true

grafana:
  # Valor FIXO intencionalmente (não vazio): com adminPassword vazio, o template do chart gera
  # uma senha ALEATÓRIA a cada render - como o ArgoCD re-renderiza o chart a cada sync, o
  # Secret muda de conteúdo toda vez, e a Application nunca fica "Synced" de verdade
  # (fica sempre OutOfSync nesse Secret). TROCAR antes de expor a UI do Grafana publicamente
  # (hoje só ClusterIP, sem Ingress).
  adminPassword: "SolidaryTech2026!"
  # ELB Classic exposto só pro IP de quem grava a demo. Se o IP mudar, editar aqui +
  # nos 3 apps/*/service.yaml e `git push`.
  service:
    type: LoadBalancer
    loadBalancerSourceRanges:
      - 177.40.131.8/32
  # Sem persistência proposital: dashboards já são provisionados de forma declarativa via
  # o sidecar (grafana.sidecar.dashboards, abaixo), então não há estado que precise
  # sobreviver a um restart do pod. Isso também evita todo o problema de Multi-Attach de
  # PVC ReadWriteOnce (que exigia strategy Recreate) - e o Recreate, por sua vez, expunha
  # um bug do ArgoCD 3.4.2 com ServerSideApply=true: mesmo um `kubectl apply --server-side`
  # manual do mesmo manifesto funcionava, mas o apply feito pelo próprio controller do
  # ArgoCD rejeitava o Deployment com "spec.strategy.rollingUpdate: Forbidden" mesmo sem
  # esse campo estar presente no values nem no manifesto renderizado pelo Helm. Com
  # persistence desabilitada, a strategy volta ao default do chart (RollingUpdate), o que
  # elimina o gatilho do bug por completo.
  persistence:
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 300m, memory: 256Mi }
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: solidarytech
          orgId: 1
          folder: "SolidaryTech"
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/solidarytech

# kube-state-metrics expõe requests/limits/usage dos Pods como métrica Prometheus - insumo
# direto do exercício de Rightsizing do relatório de FinOps (docs/FINOPS-FORECAST.md).
# Não confundir com metrics-server (API metrics.k8s.io, pré-requisito do HPA - instalado
# à parte, ver argocd/apps/observability-metrics-server.yaml).
kube-state-metrics:
  enabled: true

nodeExporter:
  enabled: true
