# SLIs/SLOs formais do donation-service - definição textual completa em
# docs/SRE-SLI-SLO-SLA.md. Este PrometheusRule é a fonte de verdade OPERACIONAL: alimenta o
# Dashboard SRE (Error Budget) e dispara os alertas que acionam o healer-service.
#
# SLI 1 - Disponibilidade: proporção de requisições HTTP não-5xx.
#   SLO: 99.9% em janela móvel de 30 dias (Error Budget = 0.1% = ~43min/mês)
# SLI 2 - Latência: proporção de requisições respondidas em < 300ms.
#   SLO: 99% em janela móvel de 30 dias
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: slo-donation-service
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: donation-service.slo.recording
      interval: 30s
      rules:
        - record: donation_service:requests:rate5m
          expr: sum(rate(http_requests_total{path="/donations"}[5m]))

        - record: donation_service:requests_5xx:rate5m
          expr: sum(rate(http_requests_total{path="/donations",status=~"5.."}[5m]))

        - record: donation_service:error_ratio:rate5m
          expr: |
            donation_service:requests_5xx:rate5m
            /
            clamp_min(donation_service:requests:rate5m, 1e-9)

        - record: donation_service:latency_p95_seconds
          expr: |
            histogram_quantile(0.95,
              sum(rate(http_request_duration_seconds_bucket{path="/donations"}[5m])) by (le)
            )

        - record: donation_service:requests_under_300ms:ratio5m
          expr: |
            sum(rate(http_request_duration_seconds_bucket{path="/donations",le="0.3"}[5m]))
            /
            clamp_min(sum(rate(http_request_duration_seconds_count{path="/donations"}[5m])), 1e-9)

    - name: donation-service.slo.alerts
      rules:
        # Burn-rate rápido: taxa de erro 5xx acima de 5% no Hot Path. `for: 2m` - dois minutos
        # de erro sustentado nesse serviço já é incidente com impacto financeiro direto (doação
        # perdida), não ruído; não justifica esperar os 5m usados em serviços menos críticos.
        - alert: DonationServiceHighErrorRate
          expr: |
            donation_service:error_ratio:rate5m > 0.05
          for: 2m
          labels:
            severity: critical
            service: donation-service
          annotations:
            summary: "donation-service com taxa de erro 5xx acima de 5% (SLO: 99.9% de sucesso)"
            description: "Error ratio (5m) = {{ $value | humanizePercentage }}. Aciona auto-healing via healer-service."

        - alert: DonationServiceHighLatency
          expr: |
            donation_service:latency_p95_seconds > 0.3
          for: 5m
          labels:
            severity: critical
            service: donation-service
          annotations:
            summary: "donation-service com p95 de latência acima de 300ms (SLO)"
            description: "p95 (5m) = {{ $value }}s. Aciona auto-healing via healer-service."

        - alert: DonationServiceCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="solidarytech", pod=~"donation-service-.*"}[10m]) > 3
          for: 2m
          labels:
            severity: critical
            service: donation-service
          annotations:
            summary: "donation-service reiniciando repetidamente (CrashLoopBackOff)"
            description: "{{ $value }} restarts em 10min no pod {{ $labels.pod }}."

        - alert: NgoServiceCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="solidarytech", pod=~"ngo-service-.*"}[10m]) > 3
          for: 2m
          labels:
            severity: warning
            service: ngo-service
          annotations:
            summary: "ngo-service reiniciando repetidamente"

        - alert: VolunteerServiceCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="solidarytech", pod=~"volunteer-service-.*"}[10m]) > 3
          for: 2m
          labels:
            severity: warning
            service: volunteer-service
          annotations:
            summary: "volunteer-service reiniciando repetidamente"

        # Alerta de Error Budget (30 dias) - não aciona auto-healing, é sinal de gestão/SRE.
        - alert: DonationServiceErrorBudgetBurnHigh
          expr: |
            (1 - avg_over_time(donation_service:error_ratio:rate5m[1d])) < 0.999
          for: 30m
          labels:
            severity: warning
            service: donation-service
          annotations:
            summary: "Error Budget do donation-service sendo consumido acima do esperado"
            description: "Disponibilidade média nas últimas 24h abaixo de 99.9% (SLO)."
