apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-solidarytech-overview
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  solidarytech-overview.json: |
    {
      "title": "SolidaryTech - Visao Geral",
      "uid": "solidarytech-overview",
      "tags": ["solidarytech", "overview"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        { "id": 100, "type": "row", "title": "Saude da plataforma", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 } },
        {
          "id": 1, "title": "Nos Ready", "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "targets": [{ "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"}) OR vector(0)" }],
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [
            { "color": "red", "value": null }, { "color": "green", "value": 1 }
          ] } } }
        },
        {
          "id": 2, "title": "Nos NotReady", "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "targets": [{ "expr": "clamp_min(count(kube_node_info) - sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"}), 0) OR vector(0)" }],
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [
            { "color": "green", "value": null }, { "color": "red", "value": 1 }
          ] } } }
        },
        {
          "id": 3, "title": "Pods com problema (solidarytech)", "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "targets": [{ "expr": "count(kube_pod_status_phase{namespace=\"solidarytech\", phase=~\"Pending|Failed|Unknown\"} == 1) OR vector(0)" }],
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [
            { "color": "green", "value": null }, { "color": "red", "value": 1 }
          ] } } }
        },
        {
          "id": 4, "title": "Restarts (solidarytech, 1h)", "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "targets": [{ "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"solidarytech\"}[1h])) OR vector(0)" }],
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [
            { "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 5 }
          ] } } }
        },

        { "id": 101, "type": "row", "title": "Golden Metrics por servico (ngo / donation / volunteer)", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 } },
        {
          "id": 10, "title": "Trafego (req/s) por servico", "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 6 },
          "targets": [{ "expr": "sum(rate(http_requests_total[5m])) by (job)", "legendFormat": "{{job}}" }]
        },
        {
          "id": 11, "title": "Taxa de erro 5xx por servico", "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 6 },
          "targets": [{
            "expr": "sum(rate(http_requests_total{status=~\"5..\"}[5m])) by (job) / clamp_min(sum(rate(http_requests_total[5m])) by (job), 1e-9)",
            "legendFormat": "{{job}}"
          }],
          "fieldConfig": { "defaults": { "unit": "percentunit" } }
        },
        {
          "id": 12, "title": "Latencia p95 por servico", "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 6 },
          "targets": [{
            "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job))",
            "legendFormat": "{{job}}"
          }],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },

        { "id": 102, "type": "row", "title": "SLO - donation-service (hot path)", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 } },
        {
          "id": 20, "title": "Disponibilidade (5m)", "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 15 },
          "targets": [{ "expr": "1 - donation_service:error_ratio:rate5m" }],
          "fieldConfig": { "defaults": { "unit": "percentunit", "thresholds": { "mode": "absolute", "steps": [
            { "color": "red", "value": null }, { "color": "yellow", "value": 0.995 }, { "color": "green", "value": 0.999 }
          ] } } }
        },
        {
          "id": 21, "title": "Latencia p95 - /donations", "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 15 },
          "targets": [{ "expr": "donation_service:latency_p95_seconds" }],
          "fieldConfig": { "defaults": { "unit": "s", "thresholds": { "mode": "absolute", "steps": [
            { "color": "green", "value": null }, { "color": "yellow", "value": 0.3 }, { "color": "red", "value": 0.5 }
          ] } } }
        },
        {
          "id": 22, "title": "Error budget consumido (30d)", "type": "gauge",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 15 },
          "targets": [{ "expr": "clamp_min((0.001 - (1 - avg_over_time(donation_service:error_ratio:rate5m[30d]))) / 0.001 * -1 + 1, 0)" }],
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "thresholds": { "mode": "absolute", "steps": [
            { "color": "green", "value": null }, { "color": "yellow", "value": 0.5 }, { "color": "red", "value": 0.9 }
          ] } } }
        },
        {
          "id": 23, "title": "Analise completa de SLO", "type": "text",
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 15 },
          "options": {
            "mode": "markdown",
            "content": "Painel dedicado de SRE/Error Budget: dashboard **SRE - donation-service** (uid `solidarytech-sre-donation`).\n\nTraces e APM: **Datadog** (app.datadoghq.com)."
          }
        },

        { "id": 103, "type": "row", "title": "Negocio e self-healing", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 21 } },
        {
          "id": 30, "title": "Doacoes processadas (rate por status)", "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 22 },
          "targets": [{ "expr": "sum(rate(donations_processed_total[5m])) by (status)", "legendFormat": "{{status}}" }]
        },
        {
          "id": 31, "title": "Auto-healing acionado (1h, por deployment)", "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 22 },
          "targets": [{
            "expr": "sum(increase(healer_actions_total[1h])) by (deployment, result)",
            "legendFormat": "{{deployment}} - {{result}}"
          }]
        },
        {
          "id": 32, "title": "Replicas atuais (HPA) por servico", "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 22 },
          "targets": [{
            "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"solidarytech\"}",
            "legendFormat": "{{horizontalpodautoscaler}}"
          }]
        }
      ]
    }
