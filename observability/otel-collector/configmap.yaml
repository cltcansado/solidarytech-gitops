apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }

    processors:
      batch: {}
      resourcedetection:
        detectors: [env, system]
      k8sattributes: {} # enriquece spans com pod/namespace/node — ajuda muito o AIOps a correlacionar

    exporters:
      # Sempre ativo — garante que dá pra ver os traces mesmo sem conta de APM configurada
      # ainda (útil para validar a instrumentação antes de ter Datadog/New Relic no ar).
      debug:
        verbosity: basic

      # Métricas ficam disponíveis num endpoint Prometheus scrapeável (ver ServiceMonitor
      # em observability-otel-collector, criado junto do Service deste ConfigMap).
      prometheus:
        endpoint: 0.0.0.0:8889

      # APM (Datadog) — DESLIGADO até a API key real estar no Secret `apm-credentials`
      # (TF_VAR_datadog_api_key). O Collector recusa subir (CrashLoopBackOff) se `api.key`
      # estiver vazio. Descomente e adicione "datadog" nos pipelines abaixo quando a key
      # estiver preenchida.
      # datadog:
      #   api:
      #     key: ${env:DD_API_KEY}
      #     site: ${env:DD_SITE}

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [k8sattributes, resourcedetection, batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [resourcedetection, batch]
          exporters: [debug, prometheus]
