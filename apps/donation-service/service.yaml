apiVersion: v1
kind: Service
metadata:
  name: donation-service
  namespace: solidarytech
  labels:
    app: donation-service
spec:
  selector:
    app: donation-service
  ports:
    - port: 8082
      targetPort: 8082
      name: http
  # Exposto na internet SÓ para o IP de quem grava a demo (ELB Classic da AWS). O
  # donation-service tem o endpoint /debug/crash habilitado (CHAOS_ENDPOINTS_ENABLED) —
  # NUNCA usar 0.0.0.0/0 aqui. Se o IP mudar, editar a linha abaixo e `git push`.
  type: LoadBalancer
  loadBalancerSourceRanges:
    - 177.40.131.8/32
