apiVersion: apps/v1
kind: Deployment
metadata:
  name: donation-service
  namespace: solidarytech
  labels:
    app: donation-service
    solidarytech.io/tier: critical
spec:
  replicas: 3 # Hot Path - mais réplicas que os outros 2 serviços por padrão
  selector:
    matchLabels:
      app: donation-service
  template:
    metadata:
      labels:
        app: donation-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/metrics"
    spec:
      # nada de toleration para o node group Spot aqui: o Hot Path fica no node group
      # ON_DEMAND (mais estável), custo maior compensado pela criticidade do serviço.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: donation-service }
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        # A imagem distroless:nonroot define o usuário pelo NOME "nonroot" no /etc/passwd
        # embutido, não por UID numérico direto na diretiva USER do Dockerfile. Sem runAsUser
        # explícito, o kubelet não consegue verificar que o container roda como não-root e
        # recusa iniciar: "container has runAsNonRoot and image has non-numeric user".
        # 65532 é o UID padrão do usuário "nonroot" em todas as imagens distroless do Google.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: donation-service
          image: 822349061423.dkr.ecr.us-east-1.amazonaws.com/solidarytech/donation-service:f7fd9a199077
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef: { name: donation-service-config }
            - secretRef: { name: donation-service-db }
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            # Checa o banco (HealthHandler) - tira o pod do Service se o RDS estiver fora,
            # sem matar o container.
            httpGet: { path: /health, port: 8082 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            # NÃO aponta para /health por design: livenessProbe existe pra detectar o
            # processo travado, não uma dependência externa fora do ar - se apontasse pra
            # /health, uma queda do RDS derrubaria pods saudáveis em CrashLoopBackOff (visto
            # em incidente real desta entrega, documentado no relatório de SRE/PCN-DR).
            httpGet: { path: /live, port: 8082 }
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
