apiVersion: apps/v1
kind: Deployment
metadata:
  name: volunteer-service
  namespace: solidarytech
  labels:
    app: volunteer-service
    solidarytech.io/tier: non-critical
spec:
  replicas: 2
  selector:
    matchLabels:
      app: volunteer-service
  template:
    metadata:
      labels:
        app: volunteer-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/metrics"
    spec:
      tolerations:
        - key: "solidarytech.io/spot"
          operator: "Equal"
          value: "true"
          effect: "PreferNoSchedule"
      securityContext:
        runAsNonRoot: true
        # ver comentário equivalente em apps/donation-service/deployment.yaml -
        # distroless:nonroot exige runAsUser numérico explícito.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: volunteer-service
          image: 822349061423.dkr.ecr.us-east-1.amazonaws.com/solidarytech/volunteer-service:520e9add0fb8
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef: { name: volunteer-service-config }
            - secretRef: { name: volunteer-service-env }
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet: { path: /health, port: 8083 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8083 }
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
