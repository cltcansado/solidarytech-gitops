apiVersion: v1
kind: Service
metadata:
  name: ngo-service
  namespace: solidarytech
  labels:
    app: ngo-service
spec:
  selector:
    app: ngo-service
  ports:
    - port: 8081
      targetPort: 8081
      name: http
  # Exposto na internet só para o IP de quem grava a demo (ELB Classic). Se o IP mudar,
  # editar a linha abaixo nos 3 services + values do Grafana e `git push`.
  type: LoadBalancer
  loadBalancerSourceRanges:
    - 177.40.131.8/32
