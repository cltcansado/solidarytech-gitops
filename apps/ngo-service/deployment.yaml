apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngo-service
  namespace: solidarytech
  labels:
    app: ngo-service
    solidarytech.io/tier: non-critical
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ngo-service
  template:
    metadata:
      labels:
        app: ngo-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      # roda preferencialmente no node group Spot (não-crítico) - FinOps
      tolerations:
        - key: "solidarytech.io/spot"
          operator: "Equal"
          value: "true"
          effect: "PreferNoSchedule"
      securityContext:
        runAsNonRoot: true
        # ver comentário equivalente em apps/donation-service/deployment.yaml -
        # distroless:nonroot exige runAsUser numérico explícito.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ngo-service
          image: 320688111502.dkr.ecr.us-east-1.amazonaws.com/solidarytech/ngo-service:dff0fc6da601
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef: { name: ngo-service-config }
            - secretRef: { name: ngo-service-db }
          # Rightsizing inicial (SEM histórico de carga real) - ver docs/FINOPS-FORECAST.md
          # para os valores ajustados após a Etapa E13 (carga real observada via Prometheus).
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet: { path: /health, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            # /live em vez de /health por design - ver achado #13 (donation-service).
            httpGet: { path: /live, port: 8081 }
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
