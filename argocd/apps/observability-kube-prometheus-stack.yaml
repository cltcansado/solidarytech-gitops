apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 60.3.0
      helm:
        valueFiles:
          - $values/observability/kube-prometheus-stack-values.yaml
    - repoURL: https://github.com/cltcansado/solidarytech-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Os CRDs do Prometheus Operator (Alertmanager/Prometheus/PrometheusRule) têm schema
      # OpenAPI enorme — o apply client-side padrão do kubectl estoura o limite de 262144
      # bytes da annotation kubectl.kubernetes.io/last-applied-configuration. Server-Side
      # Apply é a solução documentada da própria comunidade do chart para esse problema.
      - ServerSideApply=true
